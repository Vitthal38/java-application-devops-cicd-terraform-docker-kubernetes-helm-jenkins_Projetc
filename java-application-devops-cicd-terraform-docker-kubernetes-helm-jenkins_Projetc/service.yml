apiVersion: v1
kind: Service
metadata:
  name: java-war-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8080"
spec:
  type: LoadBalancer
  selector:
    app: java-war-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
